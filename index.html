<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Geschützter Bereich</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505; color: #ffffff; overflow-x: hidden;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .bg-blob {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        .blob1 { width: 400px; height: 400px; background: rgba(255, 255, 255, 0.15); top: -10%; left: -10%; }
        .blob2 { width: 500px; height: 500px; background: rgba(100, 100, 100, 0.2); bottom: -20%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        .glass-box {
            width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
            padding: 40px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { margin-top: 0; font-size: 1.8em; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; font-size: 0.9em; }

        input {
            width: 100%; padding: 15px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            color: #fff; font-family: inherit; font-size: 1em; box-sizing: border-box; 
            text-align: center; letter-spacing: 2px; transition: all 0.3s;
        }

        input:focus { outline: none; border-color: rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.1); }

        .cta-button {
            background: #fff; color: #000; padding: 15px; font-size: 1em; width: 100%;
            border-radius: 30px; border: none; font-weight: bold; cursor: pointer;
            margin-top: 20px; transition: all 0.3s;
        }
        .cta-button:hover { background: #ccc; transform: scale(1.02); }

        #error-msg {
            color: #ff4d4d; font-size: 0.9em; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>

    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>

    <div class="glass-box">
        <h1>Wartungsmodus</h1>
        <p>Diese Seite befindet sich aktuell im Aufbau. Bitte gib das Passwort ein, um fortzufahren.</p>
        
        <!-- Das Skript fängt das Enter-Drücken ab -->
        <form onsubmit="checkPassword(event)">
            <input type="password" id="pwd" placeholder="Passwort" required>
            <button type="submit" class="cta-button">Eintreten</button>
        </form>

        <div id="error-msg">Falsches Passwort. Bitte erneut versuchen.</div>
    </div>

    <script>
    function checkPassword(event) {
        event.preventDefault(); 
        
        const passwordInput = document.getElementById('pwd').value;
        const errorMsg = document.getElementById('error-msg');

        if (passwordInput === 'mathe2026') {
            // Den unsichtbaren Stempel für diese Sitzung setzen
            sessionStorage.setItem('zugangGewaehrt', 'ja');
            window.location.href = 'start.html';
        } else {
            errorMsg.style.display = 'block';
            document.getElementById('pwd').value = '';
        }
    }
</script>

</body>
</html>
