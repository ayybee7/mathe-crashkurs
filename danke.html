<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vielen Dank! - Mathe Crashkurs</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Hintergrund Blobs für den Glas-Effekt */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        .blob1 { width: 400px; height: 400px; background: rgba(255, 255, 255, 0.15); top: -10%; left: -10%; }
        .blob2 { width: 500px; height: 500px; background: rgba(100, 100, 100, 0.2); bottom: -20%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        /* Hauptkarte */
        .glass-box {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { 
            margin-top: 0; 
            font-size: 2.5em; 
            margin-bottom: 20px; 
            font-weight: 700;
            letter-spacing: -1px;
        }

        p { 
            font-size: 1.2em; 
            line-height: 1.6; 
            color: #aaa; 
            margin-bottom: 40px;
        }

        /* Zurück-Button */
        .cta-button {
            background: #fff;
            color: #000;
            padding: 15px 35px;
            font-size: 1.1em;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: all 0.3s;
        }

        .cta-button:hover { 
            background: #ccc; 
            transform: scale(1.05); 
        }

        /* Kleines Icon (Häkchen) */
        .check-icon {
            font-size: 4em;
            margin-bottom: 20px;
            display: inline-block;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>

    <div class="glass-box">
        <div class="check-icon">✅</div>
        <h1>Vielen Dank!</h1>
        <p>Wir haben deine Anfrage erfolgreich erhalten. Unser Team wird die Details prüfen und sich zeitnah bei dir melden, um die nächsten Schritte zu besprechen.</p>
        <a href="index.html" class="cta-button">Zurück zur Startseite</a>
    </div>

</body>
</html>
